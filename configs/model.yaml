# Model Configuration
# This file contains model architecture parameters

# CT Scan Classifier
ct_classifier:
  backbone: "resnet18"  # resnet18, resnet50, efficientnet_b0, efficientnet_b1
  num_classes: 2
  pretrained: true
  dropout: 0.5
  input_channels: 3

# 3D Volume Classifier
ct_volume_classifier:
  num_classes: 2
  input_channels: 1
  dropout: 0.5

# EfficientNet Configuration
efficientnet:
  model_name: "efficientnet_b0"  # efficientnet_b0, efficientnet_b1
  num_classes: 2
  pretrained: true
  dropout: 0.5

# Loss Functions
losses:
  focal:
    alpha: null  # null for auto, or specify weights
    gamma: 2.0
    reduction: "mean"
  
  tversky:
    alpha: 0.3
    beta: 0.7
    smooth: 1.0
  
  dice:
    smooth: 1.0
  
  combined:
    ce_weight: 0.5
    focal_weight: 0.5
    focal_gamma: 2.0
    focal_alpha: null
  
  label_smoothing:
    num_classes: 2
    smoothing: 0.1

# Optimizers
optimizers:
  adam:
    lr: 0.001
    weight_decay: 1e-4
    betas: [0.9, 0.999]
  
  sgd:
    lr: 0.01
    weight_decay: 1e-4
    momentum: 0.9
  
  adamw:
    lr: 0.001
    weight_decay: 0.01
    betas: [0.9, 0.999]

# Schedulers
schedulers:
  cosine:
    T_max: 50
    eta_min: 1e-6
  
  step:
    step_size: 20
    gamma: 0.1
  
  exponential:
    gamma: 0.95
  
  plateau:
    mode: "max"
    factor: 0.5
    patience: 5
    threshold: 1e-4
